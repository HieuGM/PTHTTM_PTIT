<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Định giá Nhà — ISD A02</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; max-width:420px; margin:0 auto; padding:16px; }
  .app-header { text-align:center; padding:18px 0 8px; }
  .app-header .icon { font-size:44px; }
  .app-header h1 { font-size:20px; margin-top:6px; }
  .app-header p { font-size:12px; color:#94a3b8; margin-top:4px; }
  .card { background:#1e293b; border-radius:14px; padding:16px; margin-top:14px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field.full { grid-column:1 / -1; }
  .field label { display:block; font-size:11px; color:#94a3b8; margin-bottom:4px; }
  .field input, .field select { width:100%; padding:10px; border-radius:9px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:15px; }
  .field input:focus, .field select:focus { outline:2px solid #10b981; }
  .btn { width:100%; margin-top:16px; padding:14px; border:none; border-radius:11px; background:linear-gradient(135deg,#10b981,#3b82f6); color:#fff; font-size:16px; font-weight:600; }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.6; }
  .result { text-align:center; padding:10px 0; }
  .result .big { font-size:34px; font-weight:800; color:#34d399; margin:8px 0; }
  .result .range { font-size:13px; color:#94a3b8; }
  .arch { font-size:10.5px; color:#64748b; text-align:center; margin-top:14px; line-height:1.5; }
  .err { background:#7f1d1d; color:#fecaca; padding:12px; border-radius:10px; font-size:13px; margin-top:12px; }
  .settings { text-align:center; margin-top:10px; }
  .settings input { width:100%; padding:8px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#94a3b8; font-size:12px; }
</style>
</head>
<body>
  <div class="app-header">
    <div class="icon">🏠</div>
    <h1>Định giá Nhà — Quận King</h1>
    <p>ISD Assignment 02 · App 2 · Mobile client</p>
  </div>

  <div class="card">
    <div class="form-grid">
      <div class="field"><label>Diện tích sống (sqft)</label><input id="sqft_living" type="number" value="1340" min="300" max="10000"></div>
      <div class="field"><label>Diện tích lô (sqft)</label><input id="sqft_lot" type="number" value="5650" min="500" max="200000"></div>
      <div class="field"><label>Số phòng ngủ</label><input id="bedrooms" type="number" value="3" min="0" max="15"></div>
      <div class="field"><label>Số vệ sinh</label><input id="bathrooms" type="number" value="1.5" min="0" max="10" step="0.5"></div>
      <div class="field"><label>Diện tích trên đất</label><input id="sqft_above" type="number" value="1340" min="0" max="10000"></div>
      <div class="field"><label>Tầng hầm (sqft)</label><input id="sqft_basement" type="number" value="0" min="0" max="5000"></div>
      <div class="field"><label>Số tầng</label><input id="floors" type="number" value="1" min="1" max="4" step="0.5"></div>
      <div class="field"><label>Năm xây</label><input id="yr_built" type="number" value="1976" min="1900" max="2015"></div>
      <div class="field"><label>Năm sửa (0=chưa)</label><input id="yr_renovated" type="number" value="0" min="0" max="2015"></div>
      <div class="field"><label>View mặt nước (0/1)</label><input id="waterfront" type="number" value="0" min="0" max="1"></div>
      <div class="field"><label>Cấp view (0–4)</label><input id="view" type="number" value="0" min="0" max="4"></div>
      <div class="field"><label>Tình trạng (1–5)</label><input id="condition" type="number" value="4" min="1" max="5"></div>
      <div class="field"><label>Grade (1–13)</label><input id="grade" type="number" value="7" min="1" max="13"></div>
      <div class="field"><label>Vĩ độ</label><input id="lat" type="number" value="47.61" min="47" max="47.8" step="0.001"></div>
      <div class="field"><label>Kinh độ</label><input id="long" type="number" value="-122.29" min="-122.6" max="-121" step="0.001"></div>
      <div class="field"><label>Zipcode</label><input id="zipcode" type="number" value="98103" min="98000" max="98200"></div>
    </div>
    <button class="btn" onclick="predict()">💰 Định giá</button>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="result">
      <div style="font-size:12px;color:#94a3b8">Giá dự đoán</div>
      <div class="big" id="price">—</div>
      <div class="range" id="range"></div>
    </div>
  </div>

  <div class="card settings">
    <label style="font-size:11px;color:#64748b">Địa chỉ REST API (cấu hình khi deploy)</label>
    <input id="apiUrl" value="https://house-api-odk5.onrender.com" oninput="localStorage.setItem('hsApi',this.value)">
  </div>

  <div class="arch">
    Mobile UI → REST API FastAPI → Preprocessing (scale + one-hot zipcode) → GradientBoosting → Giá USD → Mobile UI
  </div>

<script>
  const FIELDS = ["sqft_living","sqft_lot","sqft_above","sqft_basement","bedrooms","bathrooms",
                  "floors","waterfront","view","condition","grade","yr_built","yr_renovated","lat","long","zipcode"];
  document.getElementById("apiUrl").value = "https://house-api-odk5.onrender.com";

  async function predict() {
    const api = document.getElementById("apiUrl").value.replace(/\/$/, "");
    const body = {};
    FIELDS.forEach(f => body[f] = parseFloat(document.getElementById(f).value) || 0);
    const btn = document.querySelector(".btn");
    btn.disabled = true; btn.textContent = "Đang định giá...";
    try {
      const res = await fetch(api + "/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const r = await res.json();
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("price").textContent = "$" + r.predicted_price.toLocaleString("en-US");
      document.getElementById("range").textContent = "Dải tham chiếu ±12%: " + r.confidence_range;
    } catch (e) {
      const card = document.getElementById("resultCard");
      card.style.display = "block";
      card.innerHTML = '<div class="err">⚠️ Không gọi được API: ' + e.message + '</div>';
    } finally {
      btn.disabled = false; btn.textContent = "💰 Định giá";
    }
  }
</script>
</body>
</html>
