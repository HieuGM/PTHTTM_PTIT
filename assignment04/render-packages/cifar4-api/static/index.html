<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nhận dạng vật thể — SE-CNN (ASM04 App 2)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; padding:16px; max-width:480px; margin:0 auto; }
  h1 { font-size:1.2rem; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; font-size:.8rem; color:#94a3b8; margin-bottom:16px; }
  .card { background:#1e293b; border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid #334155; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid canvas { width:100%; border-radius:8px; border:2px solid transparent; cursor:pointer; image-rendering:pixelated; }
  .grid canvas.sel { border-color:#22c55e; }
  .btn { width:100%; padding:14px; border:0; border-radius:10px; font-size:1rem; font-weight:600; margin-top:10px; cursor:pointer; }
  .primary { background:#8b5cf6; color:#fff; }
  .big { text-align:center; font-size:1.6rem; font-weight:800; color:#a78bfa; }
  .conf { text-align:center; color:#94a3b8; font-size:.85rem; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:.75rem; }
  .bar-label { width:76px; color:#cbd5e1; overflow:hidden; text-overflow:ellipsis; }
  .bar-track { flex:1; background:#0f172a; border-radius:6px; height:15px; overflow:hidden; }
  .bar-fill { height:100%; background:#8b5cf6; border-radius:6px; transition:width .4s; }
  .bar-val { width:48px; color:#94a3b8; font-size:.7rem; }
  input[type=file] { color:#94a3b8; font-size:.8rem; margin-top:8px; }
  .hint { font-size:.75rem; color:#64748b; text-align:center; margin-top:6px; }
</style>
</head>
<body>
  <h1>🖼️ Nhận dạng vật thể CIFAR-10</h1>
  <div class="sub">CNN cải tiến M4: Conv+BN+Residual+SE attention · ASM04 App 2</div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:8px">Chọn ảnh mẫu (từ 10k ảnh test)</div>
    <div class="grid" id="grid"></div>
    <input type="file" id="file" accept="image/*" onchange="upload(event)">
    <div class="hint">Hoặc tải ảnh riêng (tự resize 32×32×3)</div>
    <button class="btn primary" onclick="predict()">🔍 Dự đoán bằng SE-CNN</button>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="big" id="label">?</div>
    <div class="conf" id="conf"></div>
  </div>
  <div class="card" id="probsCard" style="display:none">
    <div style="font-weight:600;margin-bottom:8px">Xác suất 10 lớp</div>
    <div id="bars"></div>
  </div>

<script>
let selected = null;
const CLASSES = ["airplane","automobile","bird","cat","deer","dog","frog","horse","ship","truck"];

function draw32(canvas, img32){
  canvas.width = 32; canvas.height = 32;
  const c = canvas.getContext('2d'), d = c.createImageData(32, 32);
  for (let i = 0; i < 32*32; i++){
    d.data[i*4]   = Math.round(img32[Math.floor(i/32)][i%32][0]*255);
    d.data[i*4+1] = Math.round(img32[Math.floor(i/32)][i%32][1]*255);
    d.data[i*4+2] = Math.round(img32[Math.floor(i/32)][i%32][2]*255);
    d.data[i*4+3] = 255;
  }
  c.putImageData(d, 0, 0);
}

async function loadSamples(){
  try {
    const r = await (await fetch('/samples?n=12')).json();
    const grid = document.getElementById('grid');
    r.samples.forEach(s => {
      const cv = document.createElement('canvas');
      draw32(cv, s.image);
      cv.onclick = () => { document.querySelectorAll('.grid canvas').forEach(x=>x.classList.remove('sel'));
        cv.classList.add('sel'); selected = s.image; };
      cv.title = 'Nhãn thật: ' + s.label_name;
      grid.appendChild(cv);
    });
  } catch (e) { console.error(e); }
}
loadSamples();

function upload(ev){
  const f = ev.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = 32; cv.height = 32;
    cv.getContext('2d').drawImage(img, 0, 0, 32, 32);
    const d = cv.getContext('2d').getImageData(0, 0, 32, 32).data;
    selected = [];
    for (let i = 0; i < 32; i++){ const row = [];
      for (let j = 0; j < 32; j++){ const k = (i*32+j)*4;
        row.push([+(d[k]/255).toFixed(4), +(d[k+1]/255).toFixed(4), +(d[k+2]/255).toFixed(4)]); }
      selected.push(row); }
    const grid = document.getElementById('grid');
    document.querySelectorAll('.grid canvas').forEach(x=>x.classList.remove('sel'));
    const big = document.createElement('canvas'); draw32(big, selected); big.classList.add('sel');
    grid.insertBefore(big, grid.firstChild);
  };
  img.src = URL.createObjectURL(f);
}

async function predict(){
  if (!selected) return alert('Hãy chọn 1 ảnh mẫu hoặc tải ảnh lên');
  const btn = document.querySelector('.primary'); btn.disabled = true; btn.textContent = '⏳ Đang dự đoán...';
  try {
    const res = await fetch('/predict', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ image: selected }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const r = await res.json();
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('label').textContent = r.prediction_label_vi + ' (' + r.prediction + ')';
    document.getElementById('conf').textContent = `Độ tin cậy ${(r.confidence*100).toFixed(1)}% · ${r.model}`;
    const bars = document.getElementById('bars'); bars.innerHTML = '';
    Object.entries(r.probabilities).forEach(([k, v]) => {
      const top = k === r.prediction;
      bars.insertAdjacentHTML('beforeend',
        `<div class="bar-row"><div class="bar-label ${top?'top':''}">${k}</div>
         <div class="bar-track"><div class="bar-fill" style="width:${(v*100).toFixed(1)}%;background:${top?'#22c55e':'#8b5cf6'}"></div></div>
         <div class="bar-val">${(v*100).toFixed(1)}%</div></div>`);
    });
    document.getElementById('probsCard').style.display = 'block';
    const t = bars.querySelector('.top'); if (t) t.style.color = '#22c55e';
  } catch (e) { alert('Lỗi gọi API: ' + e.message); }
  btn.disabled = false; btn.textContent = '🔍 Dự đoán bằng SE-CNN';
}
</script>
</body>
</html>
