<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nhận dạng chữ số — CNN (ASM04 App 1)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#0f172a; color:#e2e8f0; min-height:100vh; padding:16px; max-width:480px; margin:0 auto; }
  h1 { font-size:1.25rem; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; font-size:.8rem; color:#94a3b8; margin-bottom:16px; }
  .card { background:#1e293b; border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid #334155; }
  canvas#draw { background:#000; border-radius:10px; touch-action:none; width:100%; display:block; cursor:crosshair; }
  .btn { width:100%; padding:14px; border:0; border-radius:10px; font-size:1rem; font-weight:600; margin-top:10px; cursor:pointer; }
  .primary { background:#3b82f6; color:#fff; } .ghost { background:#334155; color:#cbd5e1; }
  .result { text-align:center; }
  .digit { font-size:4rem; font-weight:800; color:#60a5fa; line-height:1; }
  .conf { color:#94a3b8; font-size:.85rem; margin-top:6px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:.8rem; }
  .bar-label { width:20px; text-align:right; color:#cbd5e1; }
  .bar-track { flex:1; background:#0f172a; border-radius:6px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:#3b82f6; border-radius:6px; transition:width .4s; }
  .bar-val { width:48px; color:#94a3b8; font-size:.72rem; }
  .top { background:#3b82f6; color:#fff; border-radius:6px; padding:0 5px; }
  .hint { font-size:.75rem; color:#64748b; text-align:center; margin-top:6px; }
</style>
</head>
<body>
  <h1>🔢 Nhận dạng chữ số viết tay</h1>
  <div class="sub">CNN Conv8→Conv16→Pool→Dense · MNIST · ASM04 App 1</div>

  <div class="card">
    <canvas id="draw" width="280" height="280"></canvas>
    <div class="hint">✍️ Vẽ 1 chữ số (0–9) vào ô đen — nét trắng, nền đen như MNIST</div>
    <button class="btn primary" onclick="predict()">🔍 Dự đoán bằng CNN</button>
    <button class="btn ghost" onclick="clearCanvas()">🗑️ Xoá &amp; vẽ lại</button>
  </div>

  <div class="card result" id="resultCard" style="display:none">
    <div class="digit" id="digit">?</div>
    <div class="conf" id="conf"></div>
  </div>

  <div class="card" id="probsCard" style="display:none">
    <div style="font-weight:600;margin-bottom:8px">Xác suất 10 lớp (softmax)</div>
    <div id="bars"></div>
  </div>

<script>
const cv = document.getElementById('draw'), ctx = cv.getContext('2d');
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 280, 280);
ctx.strokeStyle = '#fff'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
let drawing = false;

function pos(e){ const r = cv.getBoundingClientRect();
  return { x:(e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top }; }
function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
function end(){ drawing = false; }
cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
cv.addEventListener('touchstart', start, {passive:false});
cv.addEventListener('touchmove', move, {passive:false});
cv.addEventListener('touchend', end);

function clearCanvas(){ ctx.fillStyle='#000'; ctx.fillRect(0,0,280,280); }

function toMnist28(){
  // Thu nhỏ 280×280 → 28×28 bằng canvas phụ — đúng preprocessing [0,1]
  const small = document.createElement('canvas'); small.width = 28; small.height = 28;
  small.getContext('2d').drawImage(cv, 0, 0, 28, 28);
  const d = small.getContext('2d').getImageData(0, 0, 28, 28).data;
  const img = [];
  for (let i = 0; i < 28; i++){ const row = [];
    for (let j = 0; j < 28; j++){ const a = d[(i*28+j)*4]; row.push(+(a/255).toFixed(4)); }
    img.push(row); }
  return img;
}

async function predict(){
  const btn = document.querySelector('.primary'); btn.disabled = true; btn.textContent = '⏳ Đang dự đoán...';
  try {
    const res = await fetch('/predict', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ image: toMnist28() }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const r = await res.json();
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('digit').textContent = r.prediction;
    document.getElementById('conf').textContent =
      `Độ tin cậy ${(r.confidence*100).toFixed(1)}% · ${r.model}`;
    const bars = document.getElementById('bars'); bars.innerHTML = '';
    Object.entries(r.probabilities).forEach(([k, v]) => {
      const top = +k === r.prediction;
      bars.insertAdjacentHTML('beforeend',
        `<div class="bar-row"><div class="bar-label ${top?'top':''}">${k}</div>
         <div class="bar-track"><div class="bar-fill" style="width:${(v*100).toFixed(1)}%"></div></div>
         <div class="bar-val">${(v*100).toFixed(1)}%</div></div>`);
    });
    document.getElementById('probsCard').style.display = 'block';
    bars.querySelector('.top').style.background = '#22c55e';
  } catch (e) { alert('Lỗi gọi API: ' + e.message); }
  btn.disabled = false; btn.textContent = '🔍 Dự đoán bằng CNN';
}
</script>
</body>
</html>
