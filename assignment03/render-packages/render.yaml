# Render Blueprint — Assignment 03: 3 API (FastAPI + PyTorch MLP) + 3 Web (Streamlit)
# Mỗi service 1 thư mục con trong render-packages/
# Docs: https://render.com/docs/blueprint-spec
services:
  # ============ 3 REST API (FastAPI + PyTorch, host mobile /mobile) ============
  - type: web
    name: diabetes3-api
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/diabetes3-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: house3-api
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/house3-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: comments3-api
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/comments3-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # ============ 3 Web UI (Streamlit — gọi API, không chứa model) ============
  - type: web
    name: diabetes3-web
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/diabetes3-web
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DIABETES_API_URL
        value: https://diabetes3-api.onrender.com

  - type: web
    name: house3-web
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/house3-web
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: HOUSE_API_URL
        value: https://house3-api.onrender.com

  - type: web
    name: comments3-web
    runtime: python
    plan: free
    rootDir: assignment03/render-packages/comments3-web
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: COMMENTS_API_URL
        value: https://comments3-api.onrender.com
